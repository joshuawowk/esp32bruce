; PlatformIO env for the Bruce split-display MASTER (headless PSRAM canvas +
; SPI link to a ZX2D80CE02S slave display). Generic ESP32-S3 N16R8 recommended.
;
;   pio run -e bruce-remote-master -t upload
[env:bruce-remote-master]
board = bruce-remote-master
board_build.partitions = boards/bruce-remote-master/partitions_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/bruce-remote-master>
build_flags =
	${env.build_flags}
	-Iboards/bruce-remote-master
	-Iremote_display            ; shared bruce_remote_link.h
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DHAS_TOUCH=1
	-DALLOW_ALL_GPIO_FOR_IR_RF=1

lib_deps =
	${env.lib_deps}
