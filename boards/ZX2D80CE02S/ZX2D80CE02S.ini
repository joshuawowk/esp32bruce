; PlatformIO Project Configuration File
;
; PanelLan ZX2D80CE02S  (vendor code SC05_X / "WT32S3-28S PRO")
; Sold as "PanelLan / Wireless-Tag 2.8in ESP32-S3" (e.g. AITRIP-style listings).
;
; Hardware:
;   - WT32-S3-WROVER module: ESP32-S3 N8R2 (8MB QIO flash, 2MB QSPI PSRAM)
;   - ST7789 240x320 IPS over an 8-bit Intel-8080 PARALLEL bus (data pins span
;     both GPIO output banks -> TFT_PARALLEL_8_BIT_DUAL_BANK, a Bruce TFT_eSPI
;     extension in Processors/TFT_eSPI_ESP32_S3.h)
;   - FocalTech FT6x36 / FT5x06 capacitive touch (I2C @ 0x38)
;   - RS485, USB-C (native), microSD (present but not wired in vendor config),
;     BOOT button (GPIO0), EXT-IO header (5V/GND/GPIO10..14/GPIO21)

[env:ZX2D80CE02S]
board = ZX2D80CE02S
board_build.partitions = boards/ZX2D80CE02S/partitions_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ZX2D80CE02S>
build_flags =
	${env.build_flags}
	-Iboards/ZX2D80CE02S
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDISABLE_ALL_LIBRARY_WARNINGS

	; Capacitive touch present
	-DHAS_TOUCH=1

	; Allow all GPIOs for IR/RF (user wires external modules on the EXT-IO header)
	-DALLOW_ALL_GPIO_FOR_IR_RF=1

	; Redraw delay to smooth menu navigation on this display
	-DREDRAW_DELAY=1

lib_deps =
	${env.lib_deps}
