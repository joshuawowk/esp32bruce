[env:m5stack-tab5]
board = m5stack-tab5
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Interim P4 + esp-hosted Arduino-libs bundle (proven by the Launcher project).
; Phase -1 replaces this with a merged bundle that ALSO carries exFAT + Bruce crypto.
; See PORTING_PLAN.md 17.1 / 18.1 (B3).
; NOTE: no platform_packages override needed. Bruce root [env] bundle
; (main_esp32-arduino-libs, exFAT) already ships an esp32p4 build with NimBLE BLE
; + esp-hosted WiFi (C6/SDIO 4-bit) + exFAT enabled. Verified 2026-08-08.

build_src_filter =${env.build_src_filter} +<../boards/m5stack-tab5>
build_flags =
	${env.build_flags}
	-Os
	-Iboards/m5stack-tab5
	-DBOARD_HAS_PSRAM
	-DDEVICE_NAME='"M5Stack Tab5"'

	; Native USB HID (BadUSB) over the Type-C OTG port — P4 core has TinyUSB HID enabled
	-DUSB_as_HID=1

	; ---- Display: M5GFX drives the Tab5 MIPI-DSI panel (autodetects ILI9881C/ST7123/ST7121) ----
	-DUSE_M5GFX=1
	-DHAS_SCREEN=1
	-DHAS_TOUCH=1
	-DROTATION=3
	-DTFT_WIDTH=720
	-DTFT_HEIGHT=1280
	-DMINBRIGHT=10
	; fonts sized for the 1280x720 panel
	-DFP=3
	-DFM=6
	-DFG=9

	; ---- A164 detachable keyboard (raw I2C, Character mode) on ExtPort1 ----
	-DHAS_KEYBOARD=1
	-DKB_TAB5_SDA=0
	-DKB_TAB5_SCL=1
	-DKB_TAB5_INT=50
	-DKB_TAB5_ADDR=0x6D

	; ---- System / Grove I2C ----
	-DSYS_I2C_SDA=31
	-DSYS_I2C_SCL=32
	-DGROVE_SDA=53
	-DGROVE_SCL=54

	; ---- microSD (SPI mode; disjoint from the C6 SDIO pins G8-G15) ----
	-DSDCARD_CS=42
	-DSDCARD_SCK=43
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=44

	; ---- Aux SPI on the M5-Bus (shared by CC1101 + nRF24) ----
	-DSPI_SCK_PIN=5
	-DSPI_MISO_PIN=19
	-DSPI_MOSI_PIN=18
	-DSPI_SS_PIN=-1

	; ---- CC1101 sub-GHz (external module on M5-Bus SPI) ----
	-DUSE_CC1101_VIA_SPI
	-DCC1101_SS_PIN=16
	-DCC1101_GDO0_PIN=17
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN

	; ---- nRF24 (external module; shares M5-Bus SPI, own CE/CS) ----
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=48
	-DNRF24_SS_PIN=2
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN

	; ---- GT-U7 GPS (UART on the M5-Bus PC pins: TX=G6, RX=G7) ----
	-DGPS_SERIAL_TX=6
	-DGPS_SERIAL_RX=7

	; ---- IR / one-pin RF module menus (Grove Port.A) ----
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	-DIR_TX_PINS='{{"Grove SDA", GROVE_SDA}, {"Grove SCL", GROVE_SCL}}'
	-DIR_RX_PINS='{{"Grove SCL", GROVE_SCL}, {"Grove SDA", GROVE_SDA}}'
	-DRF_TX_PINS='{{"Grove SDA", GROVE_SDA}, {"Grove SCL", GROVE_SCL}}'
	-DRF_RX_PINS='{{"Grove SCL", GROVE_SCL}, {"Grove SDA", GROVE_SDA}}'

	; ---- Connectivity-first: internal C6 has no monitor/injection; disable raw 802.11 TX ----
	; (Offensive Wi-Fi is offloaded to a companion ESP32 later - PORTING_PLAN.md 11 Option A / 18.1 B2)
	-DDISABLE_RAW_RADIO=1

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.17

; TFT_eSPI has no ESP32-P4 processor path and would clash with M5GFX's bundled LovyanGFX.
lib_ignore =
	TFT_eSPI
