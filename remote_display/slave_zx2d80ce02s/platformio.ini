; ---------------------------------------------------------------------------
; Bruce split-display SLAVE firmware -- PanelLan ZX2D80CE02S (SC05_X)
;
; Standalone project (NOT part of the Bruce build). Flash this onto the
; display board. It is a dumb pixel blitter: it receives RGB565 tiles from the
; master over SPI and paints them on the parallel ST7789, and returns touch
; events. It contains none of Bruce's logic.
;
; Build/flash:
;   cd remote_display/slave_zx2d80ce02s
;   pio run -t upload
; ---------------------------------------------------------------------------
[env:zx2d80ce02s-slave]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; WT32-S3-WROVER = ESP32-S3 N8R2: 8MB flash, 2MB QSPI PSRAM
board_build.flash_mode = dio
board_build.psram_type = qspi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
	-DLGFX_USE_V1
	; Point the compiler at the shared protocol header (one level up)
	-I..

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
	lovyan03/LovyanGFX @ ^1.1.16
